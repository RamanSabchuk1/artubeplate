<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>{{name}}</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      html, body { margin: 0; height: 100%; width: 100%; overflow: hidden; background: #0b0e13; font-family: system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
      #app { position: fixed; inset: 0; }
      /* The reels render into #scene; the HUD (open-slot-ui DOM, dressed by the artubeplate skin)
         mounts into #hud on top. The Artube loading screen is injected above both at build time
         by @artube/loader's Vite plugin (mandatory on the platform). */
      #scene { position: absolute; inset: 0; }
      #scene canvas { display: block; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="scene"></div>
      <div id="hud"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
